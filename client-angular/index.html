<!DOCTYPE html>
<html lang="en" ng-app="jobPortalApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobPortal — AngularJS SPA</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#!/">JobPortal <small class="text-muted" style="font-size: 0.6em;">AngularJS</small></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#!/">Jobs</a></li>
          <li class="nav-item" ng-if="currentUser.role === 'student'">
            <a class="nav-link" href="#!/applications">My Applications</a>
          </li>
          <li class="nav-item" ng-if="currentUser.role === 'recruiter'">
            <a class="nav-link" href="#!/dashboard">Dashboard</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <!-- Logged in -->
          <li class="nav-item" ng-if="currentUser">
            <span class="nav-link text-light">Hi, {{currentUser.name}} ({{currentUser.role}})</span>
          </li>
          <li class="nav-item" ng-if="currentUser">
            <a class="nav-link btn btn-outline-light btn-sm ms-2 px-3" href="" ng-click="logout()">Logout</a>
          </li>
          <!-- Not logged in -->
          <li class="nav-item" ng-if="!currentUser">
            <a class="nav-link" href="#!/login">Login</a>
          </li>
          <li class="nav-item" ng-if="!currentUser">
            <a class="nav-link btn btn-primary btn-sm ms-2 px-3 text-white" href="#!/register">Register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ── Main View (ngRoute loads templates here) ──────────── -->
  <main>
    <div ng-view></div>
  </main>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <footer>
    <div class="container text-center">
      <p class="mb-0">Job Portal &copy; 2026 &mdash; AngularJS SPA</p>
    </div>
  </footer>

  <!-- ── Scripts ───────────────────────────────────────────── -->
  <!-- AngularJS 1.8 (CDN) -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>

  <!-- Services -->
  <script src="js/services/authService.js"></script>
  <script src="js/services/jobService.js"></script>
  <script src="js/services/applicationService.js"></script>

  <!-- Controllers -->
  <script src="js/controllers/jobsController.js"></script>
  <script src="js/controllers/jobDetailController.js"></script>
  <script src="js/controllers/loginController.js"></script>
  <script src="js/controllers/registerController.js"></script>
  <script src="js/controllers/applicationsController.js"></script>
  <script src="js/controllers/dashboardController.js"></script>

  <!-- Navbar logout (on $rootScope) -->
  <script>
    app.run(function ($rootScope, AuthService) {
      $rootScope.logout = function () {
        AuthService.logout().then(function () {
          $rootScope.currentUser = null;
          window.location.href = "#!/login";
        });
      };
    });
  </script>

</body>
</html>
