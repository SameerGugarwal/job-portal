<!-- ── Register View ─────────────────────────────────────────── -->
<div class="auth-wrapper">
  <div class="card p-4">
    <h3 class="text-center mb-4"><i class="bi bi-person-plus me-2"></i>Register</h3>

    <div class="alert alert-danger" ng-if="error">{{error}}</div>

    <form ng-submit="register()" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" ng-model="name" placeholder="John Doe" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" ng-model="email" placeholder="you@example.com" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" ng-model="password" placeholder="Min 6 characters" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" ng-model="confirmPassword" placeholder="Re-enter password" required />
      </div>

      <div class="mb-4">
        <label class="form-label d-block">I am a:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" ng-model="role" value="student" id="role-student" />
          <label class="form-check-label" for="role-student">Student / Job Seeker</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" ng-model="role" value="recruiter" id="role-recruiter" />
          <label class="form-check-label" for="role-recruiter">Recruiter</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" ng-disabled="submitting">
        <span ng-if="!submitting">Register</span>
        <span ng-if="submitting">Registering...</span>
      </button>
    </form>

    <p class="text-center mt-3 mb-0">
      Already have an account? <a href="#!/login">Login here</a>
    </p>
  </div>
</div>
