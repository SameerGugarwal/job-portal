<!-- ── Login View ────────────────────────────────────────────── -->
<div class="auth-wrapper">
  <div class="card p-4">
    <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h3>

    <div class="alert alert-danger" ng-if="error">{{error}}</div>

    <form ng-submit="login()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" ng-model="email" placeholder="you@example.com" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" ng-model="password" placeholder="Enter password" required />
      </div>

      <button type="submit" class="btn btn-primary w-100" ng-disabled="submitting">
        <span ng-if="!submitting">Login</span>
        <span ng-if="submitting">Logging in...</span>
      </button>
    </form>

    <p class="text-center mt-3 mb-0">
      Don't have an account? <a href="#!/register">Register here</a>
    </p>
  </div>
</div>
