<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recruiter Dashboard — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Dashboard Header -->
  <div class="dashboard-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <h2><i class="bi bi-briefcase me-2"></i>Welcome, <span id="recruiter-name"></span></h2>
        <p class="mb-0">Manage your job postings and applicants</p>
      </div>
      <button class="btn btn-light mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#postJobModal">
        <i class="bi bi-plus-circle me-1"></i>Post New Job
      </button>
    </div>
  </div>

  <main>
    <div class="container">
      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="stat-card">
            <p class="text-muted mb-1">Jobs Posted</p>
            <h3 id="stat-posted">0</h3>
          </div>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="jobs-spinner" class="spinner-wrapper">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- My Jobs List -->
      <h4 class="mb-3">Your Job Postings</h4>
      <div id="my-jobs-list"></div>
    </div>
  </main>

  <!-- Post Job Modal -->
  <div class="modal fade" id="postJobModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Post a New Job</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="post-job-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="job-title" class="form-label">Job Title *</label>
                <input type="text" class="form-control" id="job-title" placeholder="e.g. Frontend Developer Intern" required />
              </div>
              <div class="col-md-6">
                <label for="job-type" class="form-label">Job Type</label>
                <select class="form-select" id="job-type">
                  <option value="internship">Internship</option>
                  <option value="full-time">Full-time</option>
                  <option value="part-time">Part-time</option>
                </select>
              </div>
              <div class="col-12">
                <label for="job-description" class="form-label">Description *</label>
                <textarea class="form-control" id="job-description" rows="3" placeholder="Describe the role, responsibilities, and requirements..." required></textarea>
              </div>
              <div class="col-md-6">
                <label for="job-skills" class="form-label">Skills (comma-separated)</label>
                <input type="text" class="form-control" id="job-skills" placeholder="React, Node.js, MongoDB" />
              </div>
              <div class="col-md-6">
                <label for="job-location" class="form-label">Location</label>
                <input type="text" class="form-control" id="job-location" placeholder="e.g. Bangalore" />
              </div>
              <div class="col-md-4">
                <label for="job-salary" class="form-label">Stipend / Salary</label>
                <input type="text" class="form-control" id="job-salary" placeholder="e.g. 15,000/month" />
              </div>
              <div class="col-md-4">
                <label for="job-category" class="form-label">Category</label>
                <input type="text" class="form-control" id="job-category" placeholder="e.g. Engineering" />
              </div>
              <div class="col-md-4">
                <label for="job-deadline" class="form-label">Application Deadline</label>
                <input type="date" class="form-control" id="job-deadline" />
              </div>
            </div>
            <div class="mt-4">
              <button type="submit" class="btn btn-primary" id="post-job-btn">
                <i class="bi bi-send me-1"></i>Post Job
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Applicants Modal -->
  <div class="modal fade" id="applicantsModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="applicants-title">Applicants</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="applicants-body">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/recruiter-dashboard.js"></script>

</body>
</html>
