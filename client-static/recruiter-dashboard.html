<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recruiter Dashboard — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Dashboard Header -->
  <section class="dashboard-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h2><i class="bi bi-briefcase-fill me-2"></i>Welcome, <span id="recruiter-name"></span></h2>
        <p>Post openings, view applicants, and manage your hiring pipeline.</p>
      </div>
      <button class="btn btn-light btn-lg" data-bs-toggle="modal" data-bs-target="#postJobModal">
        <i class="bi bi-plus-circle-fill"></i> Post New Job
      </button>
    </div>
  </section>

  <main class="py-4">
    <div class="container">
      <!-- Stats Row -->
      <div class="row g-4 mb-5">
        <div class="col-md-4">
          <div class="stat-card animate-fade-in-up">
            <div class="stat-icon icon-blue"><i class="bi bi-briefcase-fill"></i></div>
            <div>
              <h3 id="stat-posted">0</h3>
              <p>Jobs Posted</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card animate-fade-in-up delay-1">
            <div class="stat-icon icon-green"><i class="bi bi-people-fill"></i></div>
            <div>
              <h3 id="stat-applicants">0</h3>
              <p>Total Applicants</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card animate-fade-in-up delay-2">
            <div class="stat-icon icon-purple"><i class="bi bi-check-circle-fill"></i></div>
            <div>
              <h3 id="stat-hired-count">0</h3>
              <p>Hired</p>
            </div>
          </div>
        </div>
      </div>

      <h4 class="mb-3"><i class="bi bi-clipboard-data me-2 text-primary"></i>Your Job Postings</h4>

      <div id="jobs-spinner" class="spinner-wrapper">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="my-jobs-list"></div>
    </div>
  </main>

  <!-- Post Job Modal -->
  <div class="modal fade" id="postJobModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-circle-fill me-2 text-primary"></i>Post a New Job</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="post-job-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="job-title" class="form-label">Job Title *</label>
                <input type="text" class="form-control" id="job-title" placeholder="e.g. Frontend Developer Intern" required />
              </div>
              <div class="col-md-6">
                <label for="job-type" class="form-label">Job Type</label>
                <select class="form-select" id="job-type">
                  <option value="internship">Internship</option>
                  <option value="full-time">Full-time</option>
                  <option value="part-time">Part-time</option>
                </select>
              </div>
              <div class="col-12">
                <label for="job-description" class="form-label">Description *</label>
                <textarea class="form-control" id="job-description" rows="4" placeholder="Describe the role, responsibilities, and requirements..." required></textarea>
              </div>
              <div class="col-md-6">
                <label for="job-skills" class="form-label">Skills (comma-separated)</label>
                <input type="text" class="form-control" id="job-skills" placeholder="React, Node.js, MongoDB" />
              </div>
              <div class="col-md-6">
                <label for="job-location" class="form-label">Location</label>
                <input type="text" class="form-control" id="job-location" placeholder="e.g. Bangalore" />
              </div>
              <div class="col-md-4">
                <label for="job-salary" class="form-label">Stipend / Salary</label>
                <input type="text" class="form-control" id="job-salary" placeholder="15,000/month" />
              </div>
              <div class="col-md-4">
                <label for="job-category" class="form-label">Category</label>
                <input type="text" class="form-control" id="job-category" placeholder="Engineering" />
              </div>
              <div class="col-md-4">
                <label for="job-deadline" class="form-label">Deadline</label>
                <input type="date" class="form-control" id="job-deadline" />
              </div>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary" id="post-job-btn">
                <i class="bi bi-send-fill"></i> Post Job
              </button>
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Applicants Modal -->
  <div class="modal fade" id="applicantsModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="applicants-title"><i class="bi bi-people-fill me-2 text-primary"></i>Applicants</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="applicants-body"></div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/recruiter-dashboard.js"></script>

</body>
</html>
