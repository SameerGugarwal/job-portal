<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Applications — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Dashboard Header -->
  <section class="dashboard-header">
    <div class="container">
      <h2><i class="bi bi-mortarboard-fill me-2"></i>Welcome, <span id="student-name"></span></h2>
      <p>Track and manage all your job applications in one place.</p>
    </div>
  </section>

  <main class="py-4">
    <div class="container">
      <!-- Stats Row -->
      <div class="row g-4 mb-5">
        <div class="col-md-4">
          <div class="stat-card animate-fade-in-up">
            <div class="stat-icon icon-blue"><i class="bi bi-send-fill"></i></div>
            <div>
              <h3 id="stat-total">0</h3>
              <p>Total Applied</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card animate-fade-in-up delay-1">
            <div class="stat-icon icon-green"><i class="bi bi-star-fill"></i></div>
            <div>
              <h3 id="stat-shortlisted">0</h3>
              <p>Shortlisted</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card animate-fade-in-up delay-2">
            <div class="stat-icon icon-purple"><i class="bi bi-trophy-fill"></i></div>
            <div>
              <h3 id="stat-hired">0</h3>
              <p>Hired</p>
            </div>
          </div>
        </div>
      </div>

      <h4 class="mb-3"><i class="bi bi-clock-history me-2 text-primary"></i>Application History</h4>

      <div id="apps-spinner" class="spinner-wrapper">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="apps-table-wrapper"></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student-dashboard.js"></script>

</body>
</html>
