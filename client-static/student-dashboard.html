<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Applications — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Dashboard Header -->
  <div class="dashboard-header">
    <div class="container">
      <h2><i class="bi bi-mortarboard me-2"></i>Welcome, <span id="student-name"></span></h2>
      <p class="mb-0">Track your job applications</p>
    </div>
  </div>

  <main>
    <div class="container">
      <!-- Stats Row -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="stat-card">
            <p class="text-muted mb-1">Total Applied</p>
            <h3 id="stat-total">0</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <p class="text-muted mb-1">Shortlisted</p>
            <h3 id="stat-shortlisted" class="text-success">0</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <p class="text-muted mb-1">Hired</p>
            <h3 id="stat-hired" style="color: #6f42c1;">0</h3>
          </div>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="apps-spinner" class="spinner-wrapper">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Applications Table -->
      <div id="apps-table-wrapper"></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student-dashboard.js"></script>

</body>
</html>
