<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <main>
    <div class="auth-wrapper">
      <div class="card p-4">
        <h3 class="text-center mb-4"><i class="bi bi-person-plus me-2"></i>Register</h3>

        <form id="register-form" novalidate>
          <!-- Name -->
          <div class="mb-3">
            <label for="reg-name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required />
            <div class="invalid-feedback">Name must be at least 2 characters.</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="reg-email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="reg-email" placeholder="you@example.com" required />
            <div class="invalid-feedback" id="reg-email-feedback">Enter a valid email address.</div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="reg-password" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="reg-password" placeholder="Min 6 characters" required />
              <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#reg-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="reg-confirm-password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="reg-confirm-password" placeholder="Re-enter password" required />
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>

          <!-- Role Selection -->
          <div class="mb-4">
            <label class="form-label d-block">I am a:</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role" id="role-student" value="student" checked />
              <label class="form-check-label" for="role-student">Student / Job Seeker</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role" id="role-recruiter" value="recruiter" />
              <label class="form-check-label" for="role-recruiter">Recruiter</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="register-btn">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
