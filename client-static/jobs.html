<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Jobs — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Page Header -->
  <section class="dashboard-header">
    <div class="container">
      <h2><i class="bi bi-search me-2"></i>Browse Opportunities</h2>
      <p>Discover thousands of jobs from top companies hiring right now.</p>
    </div>
  </section>

  <main class="py-4">
    <div class="container">
      <div class="row g-4">
        <!-- Sidebar Filters -->
        <aside class="col-lg-3">
          <div class="filter-sidebar reveal">
            <h5><i class="bi bi-funnel-fill"></i> Filters</h5>

            <form id="filter-form">
              <div class="mb-3">
                <label for="filter-search" class="form-label">Keyword</label>
                <input type="text" class="form-control" id="filter-search" placeholder="Job title, skill..." />
              </div>

              <div class="mb-3">
                <label for="filter-location" class="form-label">Location</label>
                <input type="text" class="form-control" id="filter-location" placeholder="e.g. Bangalore" />
              </div>

              <div class="mb-3">
                <label for="filter-type" class="form-label">Job Type</label>
                <select class="form-select" id="filter-type">
                  <option value="">All Types</option>
                  <option value="internship">Internship</option>
                  <option value="full-time">Full-time</option>
                  <option value="part-time">Part-time</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-2">
                <i class="bi bi-funnel"></i> Apply Filters
              </button>
              <button type="button" class="btn btn-outline-secondary w-100" id="clear-filters">
                <i class="bi bi-x-lg"></i> Clear All
              </button>
            </form>
          </div>
        </aside>

        <!-- Job List -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <p id="jobs-count" class="text-muted mb-0">Loading jobs...</p>
            <small class="text-muted">
              <i class="bi bi-info-circle"></i> Click any card to view details
            </small>
          </div>

          <div id="jobs-spinner" class="spinner-wrapper">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div id="jobs-list"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/jobs.js"></script>

</body>
</html>
