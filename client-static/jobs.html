<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Jobs — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <main class="py-4">
    <div class="container">
      <h2 class="mb-4">Browse Jobs</h2>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <form id="filter-form" class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="filter-search" class="form-label">Search</label>
            <input type="text" class="form-control" id="filter-search" placeholder="Job title or keyword..." />
          </div>
          <div class="col-md-3">
            <label for="filter-location" class="form-label">Location</label>
            <input type="text" class="form-control" id="filter-location" placeholder="e.g. Bangalore" />
          </div>
          <div class="col-md-3">
            <label for="filter-type" class="form-label">Job Type</label>
            <select class="form-select" id="filter-type">
              <option value="">All Types</option>
              <option value="internship">Internship</option>
              <option value="full-time">Full-time</option>
              <option value="part-time">Part-time</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-search"></i> Search
            </button>
            <button type="button" class="btn btn-outline-secondary" id="clear-filters" title="Clear filters">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Jobs Count -->
      <p id="jobs-count" class="text-muted mb-3"></p>

      <!-- Loading Spinner -->
      <div id="jobs-spinner" class="spinner-wrapper">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Jobs List -->
      <div id="jobs-list"></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/jobs.js"></script>

</body>
</html>
