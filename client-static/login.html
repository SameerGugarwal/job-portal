<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — JobPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="navbar-container"></div>

  <main>
    <div class="auth-wrapper">
      <div class="card p-4">
        <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h3>

        <form id="login-form" novalidate>
          <!-- Email -->
          <div class="mb-3">
            <label for="login-email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="login-email" placeholder="you@example.com" required />
            <div class="invalid-feedback" id="login-email-feedback">Email is required.</div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="login-password" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="login-password" placeholder="Enter password" required />
              <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#login-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password is required.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="login-btn">Login</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
